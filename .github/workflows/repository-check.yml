name: Repository checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check whitespace
        shell: pwsh
        run: |
          git diff --check

      - name: Check required files
        shell: pwsh
        run: |
          $required = @(
            'README.md',
            'README_ZH.md',
            'CONTRIBUTING.md',
            'CONTRIBUTING.zh-CN.md',
            'SECURITY.md',
            'SECURITY.zh-CN.md',
            'CHANGELOG.md',
            'manifest.json',
            'tooth.json',
            'xmake.lua'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing required file: $file" }
          }

      - name: Check metadata versions
        shell: pwsh
        run: |
          $manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          $tooth = Get-Content tooth.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $tooth.version) { throw 'manifest.json and tooth.json versions differ' }
          # manifest.json "platform" is the LeviLamina target type ("client"/"server"),
          # injected by the levibuildscript modpacker from the ${modPlatform} placeholder.
          if ($manifest.platform -notin @('${modPlatform}', 'client', 'server')) { throw 'manifest platform must be the ${modPlatform} placeholder or a target type (client/server)' }
          if ($manifest.entry -ne 'DearOreUI.dll') { throw 'manifest entry must be DearOreUI.dll' }
          # tooth.json "platform" is the lip packaging platform (win-x64).
          foreach ($variant in $tooth.variants) {
            if ($variant.platform -ne 'win-x64') { throw 'tooth.json variant platform must be win-x64' }
          }

      - name: Check documentation policy
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File -Filter *.md | Where-Object { $_.FullName -notmatch '\\.git\\' }
          foreach ($file in $files) {
            $content = Get-Content $file.FullName -Raw
            for ($i = 0; $i -lt $content.Length; $i++) {
              $codePoint = [int][char]$content[$i]
              if ([char]::IsHighSurrogate($content[$i]) -and $i + 1 -lt $content.Length -and [char]::IsLowSurrogate($content[$i + 1])) {
                $codePoint = [char]::ConvertToUtf32($content[$i], $content[$i + 1])
                $i++
              }
              if ($codePoint -ge 0x1F300 -and $codePoint -le 0x1FAFF) { throw "Emoji found in $($file.FullName)" }
            }
          }

      - name: Check client-only build target
        shell: pwsh
        run: |
          $workflows = Get-Content .github/workflows/build.yml, .github/workflows/release.yml -Raw
          if ($workflows -match 'target_type=server') { throw 'Server build target is not allowed' }
          if ($workflows -match '- server') { throw 'Server build matrix is not allowed' }

      - name: Check C++ formatting when available
        shell: pwsh
        run: |
          $files = Get-ChildItem src -Recurse -File | Where-Object { $_.Extension -in '.cpp', '.h', '.hpp' }
          if ($files.Count -eq 0) { exit 0 }
          if (-not (Get-Command clang-format -ErrorAction SilentlyContinue)) { Write-Host 'clang-format is not installed; skipping format check'; exit 0 }
          clang-format --dry-run --Werror --style=file $files.FullName
