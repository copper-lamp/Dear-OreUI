on:
  pull_request:
  push:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install zlib development library
        shell: cmd
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg.exe install zlib:x64-windows
          echo VCPKG_ROOT=C:\vcpkg>>%GITHUB_ENV%
          echo VCPKG_INSTALLATION_ROOT=C:\vcpkg>>%GITHUB_ENV%
          echo VCPKG_DEFAULT_TRIPLET=x64-windows>>%GITHUB_ENV%
          echo C:\vcpkg>>%GITHUB_PATH%
          echo C:\vcpkg\installed\x64-windows\bin>>%GITHUB_PATH%
          if not exist C:\vcpkg\installed\x64-windows\lib\zlib.lib exit /b 1

      - uses: xmake-io/github-action-setup-xmake@v1
        # with:
        #   xmake-version: branch@master
      
      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}-v5
          restore-keys: |
            xmake-

      - name: Reset cached zlib and libcurl packages
        shell: pwsh
        run: |
          $xmakeRoot = Join-Path $env:LOCALAPPDATA '.xmake'
          $packagePaths = @(
            (Join-Path $xmakeRoot 'packages/z/zlib'),
            (Join-Path $xmakeRoot 'packages/l/libcurl')
          )
          foreach ($path in $packagePaths) {
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }
          $buildCache = Join-Path $xmakeRoot 'cache/packages'
          if (Test-Path $buildCache) {
            Get-ChildItem $buildCache -Directory -Recurse -Force |
              Where-Object { $_.Name -in @('zlib', 'libcurl') } |
              Sort-Object FullName -Descending |
              ForEach-Object { Remove-Item $_.FullName -Recurse -Force }
          }

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m release -p windows -v --target_type=client -y

      - run: |
          xmake -v -y

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: |
            bin/
