name: CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '手动发布用的 tag（如 v0.1.0）。留空则只构建、不发布。'
        required: false
        default: ''
      release_notes:
        description: '手动发布时的 Release 说明正文。留空将从 CHANGELOG.md 读取。'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}-v2
          restore-keys: |
            xmake-

      - run: xmake repo -u

      - run: xmake f -a x64 -m release -p windows --target_type=client -y

      - run: xmake -w -y

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: bin/

      # Runs only on a manual dispatch with a release_tag filled, or on a version
  # tag push. Consumes the build artifacts and attaches them to the Release of
  # that tag.
  release:
    needs: build
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag and notes source
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.release_tag }}" >> "$GITHUB_ENV"
            echo "IS_MANUAL=true" >> "$GITHUB_ENV"
          else
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "IS_MANUAL=false" >> "$GITHUB_ENV"
          fi

      - name: Download mod artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: artifact/

      - name: Pack and validate mod zip
        run: |
          cp CHANGELOG.md LICENSE README.md artifact/
          find artifact -type f -name 'DearOreUI.dll' | grep -q . || { echo "DearOreUI.dll missing"; exit 1; }
          find artifact -type f -name 'manifest.json' | grep -q . || { echo "manifest.json missing"; exit 1; }
          # REAL secret guard: only a .env file blocks the release. Benign build
          # logs (*.log) are stripped from the zip instead of failing the run.
          if find artifact -type f -name '.env' | grep -q .; then
            echo "refusing to release: .env file detected in artifact"; exit 1
          fi
          (cd artifact && zip -r "../DearOreUI-windows-x64.zip" . -x '*.log')
          ls -la "DearOreUI-windows-x64.zip"

      - name: Create / update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MOD_ZIP="DearOreUI-windows-x64.zip"
          if [ "$IS_MANUAL" = "true" ]; then
            NOTES="${{ github.event.inputs.release_notes }}"
            [ -n "$NOTES" ] || NOTES="$(cat CHANGELOG.md)"
          else
            NOTES="$(cat CHANGELOG.md)"
          fi
          # If a Release already exists for this tag, only attach/refresh assets —
          # never overwrite the release notes (tag push must not clobber them).
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$MOD_ZIP" --clobber
          else
            gh release create "$TAG" "$MOD_ZIP" --title "$TAG" --notes "$NOTES"
          fi