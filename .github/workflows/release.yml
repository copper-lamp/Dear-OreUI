on:
  release:
    types:
      - published
  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1
        # with:
        #   xmake-version: branch@master

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}-v2
          restore-keys: |
            xmake-

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m release -p windows --target_type=client -y

      - run: |
          xmake -w -y

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: |
            bin/

      # Header-only public API artifact (used by the `dearoreui` xmake-repo
      # package). `xmake install` triggers the target's after_install whitelist
      # which emits include/dearoreui/{api,bridge}.
      - run: |
          xmake install -o "${{ github.workspace }}/hdrs" -y

      - name: Build headers artifact
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE/hdrs"
          $api = "$root/include/dearoreui/api/IDearOreUIApi.h"
          $brd = "$root/include/dearoreui/bridge/DearOreUIBridge.h"
          if (-not (Test-Path $api) -or -not (Test-Path $brd)) {
            Write-Error "Public headers not produced by xmake install."
            exit 1
          }
          Push-Location "$root/include"
          Compress-Archive -Path "dearoreui" -DestinationPath "$env:GITHUB_WORKSPACE/DearOreUI-headers.zip" -Force
          Pop-Location

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-headers
          path: |
            ${{ github.workspace }}/DearOreUI-headers.zip

  update-release-notes:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v3

      - uses: softprops/action-gh-release@v3
        with:
          body: |
            ${{ steps.extract-release-notes.outputs.release_notes }}

  upload-to-release:
    needs:
      - build
      - update-release-notes
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: artifact

      - uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}-headers
          path: headers-artifact

      - run: |
          cp CHANGELOG.md LICENSE README.md artifact/
          test -f artifact/DearOreUI.dll
          find artifact -type f -name '*.log' -o -name '.env' | grep -q . && exit 1 || true

      - run: |
          zip -r ../${{ github.event.repository.name }}-windows-x64.zip *
        working-directory: artifact

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ github.event.repository.name }}-windows-x64.zip
            headers-artifact/DearOreUI-headers.zip
