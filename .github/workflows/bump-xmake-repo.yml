# DearOreUI -> LiteLDev/xmake-repo 版本全自动同步（方案 A）
#
# 每次发布一个 Dear-OreUI Release（on: release/published），本 workflow 自动：
#   1. 下载刚发布的 DearOreUI-headers-<tag>.zip 并计算 sha256
#   2. 检出上游 LiteLDev/xmake-repo，新增/更新 packages/d/dearoreui/xmake.lua
#      （首次发布：生成完整包描述；后续版本：只将 add_versions 替换为新版本+sha）
#   3. 分支提交 -> 用 PAT 推到 fork -> 开 PR 到上游，等维护者合并
#
# 依赖：repo secret `XMAKE_REPO_PAT`（PAT，需 fork + push + pull_request 权限）。
# 资产命名约定：DearOreUI-headers-<tag>.zip（见 release.yml 的 Pack 步骤与包 add_urls）。

name: bump-xmake-repo

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要 bump 的 Release tag（如 v0.1.0）'
        required: true

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VER=${TAG#v}" >> "$GITHUB_ENV"

      - name: Download headers artifact and compute sha256
        run: |
          URL="https://github.com/copper-lamp/Dear-OreUI/releases/download/$TAG/DearOreUI-headers-$TAG.zip"
          echo "headers_url=$URL" >> "$GITHUB_ENV"
          curl -fsSL "$URL" -o headers.bin || { echo "headers asset missing for $TAG"; exit 1; }
          SHA="$(sha256sum headers.bin | cut -d' ' -f1)"
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          repository: LiteLDev/xmake-repo
          ref: main
          token: ${{ secrets.XMAKE_REPO_PAT }}
          fetch-depth: 1

      - name: Create or bump the package version block
        run: |
          PKG="packages/d/dearoreui/xmake.lua"
          if [ ! -f "$PKG" ]; then
            # First release: generate the full upstream-form package descriptor.
            mkdir -p "$(dirname "$PKG")"
            cat > "$PKG" <<EOF
set_description("DearOreUI: header-only public API for OreUI client mods")
set_license("CC0-1.0")
add_urls("https://github.com/copper-lamp/Dear-OreUI/releases/download/\$(version)/DearOreUI-headers-\$(version).zip")
add_versions("$VER", "$SHA")
on_install(function(package)
    os.vcp("dearoreui/*", package:installdir("include"))
end)
EOF
          else
            # Existing package: drop any current add_versions line, then insert the new one.
            sed -i '/^[[:space:]]*add_versions(/d' "$PKG"
            sed -i '/^[[:space:]]*add_urls(/a\add_versions("'"$VER"'", "'"$SHA"'")' "$PKG"
          fi
          echo "---- resulting $PKG ----"
          cat "$PKG"

      - name: Create branch, fork, commit and push
        env:
          GH_TOKEN: ${{ secrets.XMAKE_REPO_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "dearoreui/bump-$VER"
          git add packages/d/dearoreui/xmake.lua
          git commit -m "dearoreui: add/update version $VER" || { echo "nothing to commit"; exit 0; }
          gh repo fork LiteLDev/xmake-repo --clone=false || true
          WHO="$(gh api user --jq .login)"
          echo "WHO=$WHO" >> "$GITHUB_ENV"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${WHO}/xmake-repo.git" "dearoreui/bump-$VER"

      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ secrets.XMAKE_REPO_PAT }}
        run: |
          BRANCH="dearoreui/bump-$VER"
          PR_HEAD="${WHO}:${BRANCH}"
          if gh pr view --repo LiteLDev/xmake-repo "$BRANCH" >/dev/null 2>&1; then
            echo "A PR for $BRANCH already exists; branch was force-updated."
          else
            gh pr create --repo LiteLDev/xmake-repo --base main --head "$PR_HEAD" \
              --title "dearoreui: add/update version $VER" \
              --body "headers: $headers_url (sha256 \`$SHA\`)"
          fi