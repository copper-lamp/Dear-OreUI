name: Feature Request / 功能请求
description: Suggest a DearOreUI feature / 提议 DearOreUI 功能
title: "[Feature] "
type: feature
body:
  - type: textarea
    attributes:
      label: Problem / 要解决的问题
      description: Describe the problem clearly / 清晰描述要解决的问题。
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed solution / 方案
      description: Describe the desired behavior and API level / 描述期望行为和 API 层级。
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives / 备选方案
      description: Describe alternatives and their trade-offs / 描述备选方案及其取舍。

  - type: textarea
    attributes:
      label: Architecture impact / 架构影响
      description: List affected modules, compatibility risks, permissions, failure fallback, tests, and documentation / 列出受影响模块、兼容性风险、权限、失败回退、测试和文档。
    validations:
      required: true
